spring.application.name=ChayBook

# MSSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Server
server.port=${PORT:8080}

#JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===== GEMINI AI CHAT ===== #
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent

#https://aistudio.google.com/apikey link này để tạo api key, sau khi tạo xong thì copy api key vào dòng dưới
gemini.api.key=${GEMINI_API_KEY}

# ===== GEMINI AI RECOGNITION ===== #
gemini.vision.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent


# SMTP / Brevo HTTP Email configuration for registration and password reset OTP emails
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=true

# Brevo Transactional Email API (HTTPS 443)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:${MAIL_FROM:${MAIL_USERNAME:}}}
brevo.sender-name=${BREVO_SENDER_NAME:ChayBook}

# Geoapify Places
chaybook.geoapify.enabled=${GEOAPIFY_ENABLED:false}
chaybook.geoapify.api-key=${GEOAPIFY_API_KEY:}
chaybook.geoapify.connect-timeout-seconds=3
chaybook.geoapify.read-timeout-seconds=5


# =============== GROQ AI MODERATION ===============#
groq.base-url=https://api.groq.com/openai/v1
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# Cloudinary configuration for image and video uploads
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# Social login providers are unavailable until both credentials are configured.
app.social.login-enabled=${SOCIAL_LOGIN_ENABLED:false}
app.social.frontend-url=${SOCIAL_FRONTEND_URL:http://localhost:5173}
app.social.backend-url=${SOCIAL_BACKEND_URL:http://localhost:8080}
app.social.secure-cookie=${SOCIAL_SECURE_COOKIE:false}
app.social.google.client-id=${GOOGLE_CLIENT_ID:}
app.social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.social.facebook.client-id=${FACEBOOK_APP_ID:}
app.social.facebook.client-secret=${FACEBOOK_APP_SECRET:}
app.social.facebook.api-version=${FACEBOOK_API_VERSION:v25.0}

# Video analysis
chaybook.video.max-bytes=50000000
chaybook.video.youtube-max-duration-seconds=900

chaybook.video.storage-directory=${VIDEO_PRIVATE_DIRECTORY:./private-data/videos}
chaybook.video.ffprobe-path=${FFPROBE_PATH:ffprobe}

chaybook.video.probe-timeout-seconds=15
chaybook.video.connect-timeout-seconds=10
chaybook.video.read-timeout-seconds=120
chaybook.video.file-ready-timeout-seconds=180
chaybook.video.job-timeout-seconds=900
chaybook.video.retention-hours=72

chaybook.video.dietary-rule=LACTO_OVO
chaybook.video.policy-version=v1

chaybook.video.model=${VIDEO_GEMINI_MODEL}
chaybook.video.api-key=${GEMINI_API_KEY:}
chaybook.video.youtube-api-key=${YOUTUBE_API_KEY:}

chaybook.video.poll-delay-ms=3000
chaybook.video.cleanup-delay-ms=3600000

logging.level.com.chaybook.backend.video=INFO
#FFmpeg configuration
moderation.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
moderation.video.ffprobe-path=${FFPROBE_PATH:ffprobe}
moderation.video.max-duration-seconds=60
moderation.video.max-file-size-bytes=52428800
groq.whisper-model=${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}
