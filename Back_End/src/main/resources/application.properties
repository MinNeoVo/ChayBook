spring.application.name=ChayBook

# MSSQL connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ChayBook_Project;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Server
server.port=8080

#JWT Configuration
jwt.secret=chaybook-local-secret-key-2026-must-be-long-enough
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== GEMINI AI CONFIGURATION =====
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

#https://aistudio.google.com/apikey link này để tạo api key, sau khi tạo xong thì copy api key vào dòng dưới
gemini.api.key=${GEMINI_API_KEY}

# SMTP configuration for registration and password reset OTP emails
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
# Geoapify Places
chaybook.geoapify.enabled=${GEOAPIFY_ENABLED:false}
chaybook.geoapify.api-key=${GEOAPIFY_API_KEY:}
chaybook.geoapify.connect-timeout-seconds=3
chaybook.geoapify.read-timeout-seconds=5
