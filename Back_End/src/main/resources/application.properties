spring.application.name=ChayBook

# MSSQL connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ChayBook_Project;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Server
server.port=8080

# Authentication is stored on the server; the browser only receives a session cookie.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
#JWT Configuration
jwt.secret=chaybook-local-secret-key-2026-must-be-long-enough
jwt.expiration=86400000
