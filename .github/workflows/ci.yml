name: ChayBook CI

on:
  push:
    branches:
      - main
      - develop
      - ci/upload-surefire-artifact
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend - Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Back_End

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        env:
              GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: mvn -B clean test

      - name: Upload Maven Surefire XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-surefire-${{ github.run_id }}-backend
          path: Back_End/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30
      
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front_End

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front_End/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
