name: ChayBook CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  # =========================================================
  # CI - BACKEND
  # =========================================================
  backend:
    name: Backend - Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Back_End

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: mvn -B clean test

  # =========================================================
  # CI - FRONTEND
  # =========================================================
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front_End

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front_End/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # =========================================================
  # CD - DEPLOY PRODUCTION
  # =========================================================
  deploy:
    name: Deploy Production

    # Chỉ deploy khi cả Backend Test và Frontend Build thành công
    needs:
      - backend
      - frontend

    # Chỉ deploy khi đây là push.
    # Pull Request chỉ chạy CI, không deploy production.
    if: ${{ github.event_name == 'push' }}

    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # Checkout source code
      # =====================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # =====================================================
      # Deploy Backend to Render
      # =====================================================
      - name: Deploy Backend to Render
        run: |
          echo "Deploying backend to Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # =====================================================
      # Setup Node.js
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =====================================================
      # Install Vercel CLI
      # =====================================================
      - name: Install Vercel CLI
        run: npm install -g vercel

      # =====================================================
      # Configure Vercel Project
      # =====================================================
      - name: Configure Vercel Project
        run: |
          mkdir -p .vercel

          cat > .vercel/project.json <<EOF
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}"
          }
          EOF

          echo "Vercel project configured"

      # =====================================================
      # Pull Vercel Environment
      # =====================================================
      - name: Pull Vercel Environment
        run: |
          vercel pull --yes \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # =====================================================
      # Build Frontend with Vercel
      # =====================================================
      - name: Build Vercel
        run: |
          vercel build --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # =====================================================
      # Deploy Frontend to Vercel
      # =====================================================
      - name: Deploy Vercel
        run: |
          vercel deploy --prebuilt --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # =====================================================
      # Wait for Render
      # =====================================================
      - name: Wait for Render
        run: |
          echo "Waiting for Render backend..."
          sleep 30

      # =====================================================
      # Check Backend
      # =====================================================
      - name: Check Backend
        run: |
          echo "Checking backend..."

          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            https://chaybook.onrender.com/api/test

      # =====================================================
      # Deployment Summary
      # =====================================================
      - name: Deployment Summary
        run: |
          echo "======================================"
          echo "   CHAYBOOK DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Backend:"
          echo "https://chaybook.onrender.com"
          echo ""
          echo "Frontend:"
          echo "Vercel Production"
          echo ""
          echo "Status: SUCCESS"
          echo "======================================"
